services:
  - type: web
    name: red-team-ai
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You set this manually in the Render dashboard
      - key: DATABASE_URL
        value: sqlite:///./red_team_ai.db
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "*"
      - key: API_PREFIX
        value: /api/v1
    plan: free
